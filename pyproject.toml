[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-ad-compliance-agent"
version = "0.1.0"
description = "Multi-agent compliance checker for Russian pharma advertising (FZ-38 art. 24)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alexey Goltsev", email = "alexeygoltsev@gmail.com" }]
keywords = ["pharma", "compliance", "fz-38", "fas", "llm", "agents", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "claude-agent-sdk>=0.2.82",
    "pydantic>=2.7",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pillow>=10.3",
    "pymupdf>=1.24",
    "streamlit>=1.36",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
compliance = "pharma_ad_compliance.cli:app"

[project.urls]
Repository = "https://github.com/alexeygoltsevv/pharma-ad-compliance-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "llm: tests that call the Claude Agent SDK (require subscription auth, skipped in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # line length
    "UP042",  # StrEnum vs (str, Enum) — keeping explicit (str, Enum) for clarity
    "UP047",  # PEP 695 generics — TypeVar pattern is fine
    "B008",   # function-call defaults — required by Typer
    "SIM115", # NamedTemporaryFile in Streamlit needs to outlive function scope
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

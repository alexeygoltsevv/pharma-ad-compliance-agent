[client]
# Hide developer-mode controls (Clear caches, Rerun, hotkeys).
# Without this, the `c` hotkey intercepts Cmd+C copies and opens
# a "Clear caches" modal instead of copying selected text.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[server]
# Run headless: skip the first-run "enter your email" welcome prompt (which
# blocks any non-interactive launch — make, CI, background runs) and don't try
# to auto-open a browser.
headless = true

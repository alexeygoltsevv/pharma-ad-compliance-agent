name: Regression eval (manual)

# Triggered manually. Requires the ANTHROPIC_API_KEY repo secret to be set.
# Day-to-day, regression eval is run locally via `make eval` against the
# developer's Claude Code subscription — see docs/evaluation.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Run regression dataset
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning ::ANTHROPIC_API_KEY secret not set — skipping LLM eval."
            echo "Run 'make eval' locally with Claude Code subscription auth instead."
            exit 0
          fi
          pytest -m llm -v

services:
  pharma-claude:
    build: .
    image: pharma-ad-compliance-claude:latest
    container_name: pharma-claude
    ports:
      - "127.0.0.1:8502:8501"
    env_file:
      - claude-auth.env
    environment:
      PHARMA_AD_MODEL: "claude-sonnet-4-6"
    volumes:
      - ./case_law/approved_reports:/app/case_law/approved_reports
      # `claude` CLI persists subscription auth/state here; needs to survive
      # restarts and remain writable under read_only: true (named volume keeps
      # the rootfs immutable while preserving login state).
      - claude-cli-state:/home/app/.claude
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/app/.cache:size=32m,mode=0755
    restart: unless-stopped

volumes:
  claude-cli-state:
